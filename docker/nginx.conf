# The interface and its API on one origin, as `docs/installation.md` requires.
# HTTPS is the host's reverse proxy, in front of this one.

server {
    listen 80;
    root /usr/share/nginx/html;

    # An event carries up to ten photos of 15 MB each, sent in one request.
    client_max_body_size 151m;

    # The page loads its own code and fonts, and reaches nothing but the API and
    # the basemap's host; MapLibre runs its workers from blobs. Inherited by
    # every location below, none of which sets a header of its own.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets { }
    location / { try_files $uri /index.html; }

    location ~ ^/(replays|session|health) {
        proxy_pass http://api:3000;
        # The API sends its own; the one set above is enough.
        proxy_hide_header X-Content-Type-Options;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The host's proxy says whether the request came over HTTPS; this one
        # passes it on, and the API marks the session cookie `Secure` from it.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # A build's progress is a stream of events: buffered, it would reach
        # the page only once the build is over.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
