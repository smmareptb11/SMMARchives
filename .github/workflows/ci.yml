name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      db:
        # The image docker-compose.yml runs, so the suites see the same PostgreSQL.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smmarchives
          POSTGRES_PASSWORD: smmarchives
          POSTGRES_DB: smmarchives
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smmarchives"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://smmarchives:smmarchives@localhost:5432/smmarchives
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # The images `docker compose up --build` builds on the host: a Dockerfile that
  # no longer builds would otherwise be found on the day of a deployment.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target app --tag smmarchives-app .
      - run: docker build --target web --tag smmarchives-web .
      # The proxy's configuration, checked by nginx itself; `api` stands for the
      # container it relays to, which this job does not start.
      - run: docker run --rm --add-host api:127.0.0.1 smmarchives-web nginx -t
